  github_com_sercha-oss_sercha-enterprise_internal_core_domain.CapabilityDescriptor:
    properties:
      backend_id:
        description: |-
          BackendID is an optional tag identifying the implementation backend
          (e.g. "opensearch", "pgvector", "llm"). Used purely for UX
          (grouping, badges); the capability resolution path does not consult
          it. Empty when the capability has no specific backend.
        type: string
      default_enabled:
        description: |-
          DefaultEnabled is the toggle's default value when no per-team
          preference exists. The resolver uses this as the initial enabled
          state before applying stored preferences.
        type: boolean
      depends_on:
        description: |-
          DependsOn lists other capability types that must be enabled and
          available for this capability to function. The resolver cascades
          disable: if any dependency is not active, this capability is
          marked disabled.
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.CapabilityType'
        type: array
      description:
        description: Description is one-line guidance text rendered alongside the
          toggle.
        type: string
      display_name:
        description: DisplayName is the human-readable label rendered in the admin
          UI.
        type: string
      grants:
        description: |-
          Grants lists capabilities that this capability enables. Reverse of
          DependsOn — purely informational for the UI today.
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.CapabilityType'
        type: array
      phase:
        allOf:
        - $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.PipelinePhase'
        description: Phase indicates whether this is an indexing or search capability.
      type:
        allOf:
        - $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.CapabilityType'
        description: Type is the unique string key. Must match the registry's view.
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_domain.CapabilityPreferences:
