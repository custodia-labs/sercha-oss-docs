    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_services_ops.EdgeTypeDecl:
    properties:
      optional_properties:
        description: |-
          OptionalProperties lists property names that may be present in
          [graph.Edge.Properties] for this edge type.
        items:
          type: string
        type: array
      required_properties:
        description: |-
          RequiredProperties lists property names that must be present in
          [graph.Edge.Properties] for this edge type.
        items:
          type: string
        type: array
      type:
        description: Type is the edge type string, matching [graph.Edge.Type].
        type: string
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_services_ops.InputType:
    properties:
      description:
        description: |-
          Description is a human-readable explanation of what this input
          represents and what format or type the op expects.
        type: string
      name:
        description: |-
          Name is the identifier for this input slot. The runtime matches this
          name against wires and invocation Config keys.
        type: string
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_services_ops.NodeTypeDecl:
    properties:
      optional_properties:
        description: |-
          OptionalProperties lists property names that may be present in
          [graph.Node.Properties] for this node type.
        items:
          type: string
        type: array
      required_properties:
        description: |-
          RequiredProperties lists property names that must be present in
          [graph.Node.Properties] for this node type.
        items:
          type: string
        type: array
      type:
        description: Type is the node type string, matching [graph.Node.Type].
        type: string
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_services_ops.OpSchema:
    properties:
      dynamic_inputs:
        description: |-
          DynamicInputs are list-of-objects values that may be supplied via Config
          or wired from an upstream op's declared OutputPayloads. The runtime
          injects wire-fed values into the input JSON under the declared Name.
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_services_ops.InputType'
        type: array
      output_edges:
        description: |-
          OutputEdges declares the edge types this op may persist via GraphDelta.
          These are documentary; wires cannot address them.
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_services_ops.EdgeTypeDecl'
        type: array
      output_nodes:
        description: |-
          OutputNodes declares the node types this op may persist via GraphDelta.
          These are documentary; wires cannot address them.
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_services_ops.NodeTypeDecl'
        type: array
      output_payloads:
        description: |-
          OutputPayloads declares the named in-flight outputs this op may emit
          via OpOutput.Payloads. These are the only outputs addressable by
          downstream wires.
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_services_ops.PayloadType'
        type: array
      static_inputs:
        description: |-
          StaticInputs are always supplied by the caller in OpInvocation.Config.
          They configure how the op runs (e.g. a target identifier, a behavioural
          mode). They cannot be wire-fed.
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_services_ops.InputType'
        type: array
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_services_ops.PayloadType:
    properties:
      description:
        description: |-
          Description is a human-readable explanation of what this payload
          contains and what format or type the downstream op should expect.
        type: string
      name:
        description: |-
          Name is the identifier for this payload. Downstream wires reference it
          via Wire.FromOutputName; it must be unique within an op's OutputPayloads.
        type: string
    type: object
