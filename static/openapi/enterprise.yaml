host: localhost:8081
info:
  contact:
    name: Sercha
    url: https://sercha.dev
  description: |-
    The governed platform beneath intelligent document processing.

    Declare a schema over your documents with SerchaQL, extract it from the repositories your documents already live in, and query the result like a database. Every read is bounded by the three-layer permission model — corpus grant, corpus membership, and per-document ACL — composed with AND and fail-closed, and written to a hash-chained, tamper-evident audit log.

    `POST /api/v1/query` is the single entry point for every SerchaQL statement kind: DDL, DCL, DML, SHOW, DESCRIBE, EXPLAIN and RUN BINDING.
  license:
    name: Proprietary
    url: https://sercha.dev/license
  title: Sercha Enterprise API
  version: "1.0"
paths:
  /admin/audit/ingestions:
    get:
      description: Get ingestion audit events with optional filtering by source, token
        owner, or time range
      parameters:
      - description: Start time (RFC3339)
        in: query
        name: from
        type: string
      - description: End time (RFC3339)
        in: query
        name: to
        type: string
      - description: Filter by source ID
        in: query
        name: source_id
        type: string
      - description: Filter by token owner user ID
        in: query
        name: token_owner_id
        type: string
      - description: 'Limit (default: 50, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Offset (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_adapters_driving_http.IngestionAuditListResponse'
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/internal_adapters_driving_http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_adapters_driving_http.ErrorResponse'
        "403":
          description: Forbidden - admin only
          schema:
            $ref: '#/definitions/internal_adapters_driving_http.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/internal_adapters_driving_http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List ingestion audit events
      tags:
      - Audit
  /admin/audit/ingestions/{id}:
    get:
      description: Get a single ingestion audit event with full details
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_adapters_driving_http.IngestionAuditDTO'
        "400":
          description: Missing event ID
          schema:
            $ref: '#/definitions/internal_adapters_driving_http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_adapters_driving_http.ErrorResponse'
        "403":
