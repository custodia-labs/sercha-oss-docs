  github_com_sercha-oss_sercha-enterprise_internal_core_domain_oppipeline.DAG:
    properties:
      invocations:
        additionalProperties:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain_oppipeline.OpInvocation'
        description: |-
          Invocations is keyed by invocation ID. Each invocation is a configured
          call site of a registered op within this pipeline version.
        type: object
      wires:
        description: |-
          Wires describe data flow between invocations. Each wire carries a named
          payload from an upstream op's declared OutputPayloads to a downstream
          op's declared DynamicInputs. When FromOutputName is empty the wire uses
          the legacy behaviour of forwarding the upstream op's persisted node IDs.
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain_oppipeline.Wire'
        type: array
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_domain_oppipeline.OpInvocation:
    properties:
      config:
        description: |-
          Config is the static input passed to op.Run alongside any wired
          upstream outputs. When the input is a JSON object and wires target this
          invocation, the runtime merges wire-fed payload data under each wired
          DynamicInputs name before calling op.Run. For wires whose FromOutputName
          is empty the legacy behaviour applies: the upstream op's persisted node
          IDs are injected. Ops that take non-object input cannot consume upstream
          wires (documented limit in v1).
        items:
          type: integer
        type: array
      id:
        description: |-
          ID identifies this invocation uniquely within the DAG. Wires reference
          invocations by this ID.
        type: string
      op_id:
        description: OpID matches a registered op's ID() return value.
        type: string
      op_version:
        description: |-
          OpVersion matches a registered op's Version() return value. Combined
          with OpID, this selects the exact implementation from the registry.
        type: string
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_domain_oppipeline.Pipeline:
    properties:
      created_at:
        description: CreatedAt is when this pipeline was first created.
        type: string
      current_version_id:
        description: |-
          CurrentVersionID is the ID of the [PipelineVersion] that represents the
          most recent edit to this pipeline. It is empty for a newly created
          pipeline that has not yet had a version published.
        type: string
      id:
        description: ID is the stable unique identifier for this pipeline.
        type: string
      name:
        description: |-
          Name is the human-readable label. Names are unique within a deployment
          and are used as stable identifiers in API paths.
        type: string
      updated_at:
        description: |-
          UpdatedAt is when this pipeline was last modified (e.g. a new version
          was published or CurrentVersionID was advanced).
        type: string
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_domain_oppipeline.PipelineVersion:
    properties:
      created_at:
        description: CreatedAt is when this version was created.
        type: string
      dag:
        allOf:
        - $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain_oppipeline.DAG'
        description: |-
          DAG is the complete, immutable graph of op invocations and wires for
          this version. Callers must call [DAG.Validate] before persisting.
      id:
        description: ID is the stable unique identifier for this version.
        type: string
      pipeline_id:
        description: PipelineID references the parent [Pipeline].
        type: string
      version_number:
        description: |-
          VersionNumber is a monotonically increasing counter starting at 1. The
          repository is responsible for computing the next version number by
          counting existing versions for the pipeline.
        type: integer
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_domain_oppipeline.Run:
    properties:
      created_at:
        description: CreatedAt is when this run record was created (before execution
          began).
        type: string
      ended_at:
        description: |-
          EndedAt is when the run reached a terminal state ([RunStatusSealed] or
          [RunStatusFailed]). Nil until then.
        type: string
      error:
        description: Error contains the error message if the run ended in [RunStatusFailed].
        type: string
      id:
        description: ID is the stable unique identifier for this run.
        type: string
      input_overrides:
        additionalProperties:
          items:
            type: integer
          type: array
        description: |-
          InputOverrides carries per-invocation Config overrides applied by the
          executor before each op runs. The map is keyed by [OpInvocation.ID]
          (the invocation key), and each value is a JSON object whose fields are
          shallow-merged into that invocation's [OpInvocation.Config] before
          op.Run is called.

          Used by triggers that need to scope a Run without re-deriving a new
          PipelineVersion — e.g. a per-document incremental Run reuses the
          binding's DAG but overrides the extraction invocations' document_ids
          to a single ID. Nil means no overrides; the executor runs the
          invocations with their persisted Config as-is.
        type: object
      kind:
        allOf:
        - $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain_oppipeline.RunKind'
        description: |-
          Kind discriminates between extraction runs and query runs. Extraction
          runs stage nodes/edges into the graph; query runs return a RowSet
          directly to the caller without touching the staging tables.

          Defaults to [RunKindExtraction] when constructed via [NewRun] or
          [NewRunWithOverrides] so that all existing call sites continue to
          produce extraction runs without modification. Use [NewQueryRun] to
          create a query run.
      pipeline_id:
        description: PipelineID references the parent [Pipeline].
        type: string
      pipeline_version_id:
        description: |-
          PipelineVersionID references the exact [PipelineVersion] that was
          executed. Stored separately so historical runs always reflect the DAG
          that was actually used, even after the pipeline is edited.
        type: string
      started_at:
        description: |-
          StartedAt is when the executor began invoking ops. Nil until the run
          transitions to [RunStatusRunning].
        type: string
      status:
        allOf:
        - $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain_oppipeline.RunStatus'
        description: Status is the current state of this run.
      trace:
        description: |-
          Trace holds structured per-op status, timing, and error information
          written by the executor as the run progresses. The shape is defined by
          the executor; the domain layer treats it as opaque JSON.
        items:
          type: integer
        type: array
      trigger_kind:
        allOf:
        - $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain_oppipeline.TriggerKind'
        description: TriggerKind describes what caused this run to be created.
      triggered_by:
        description: |-
          TriggeredBy is an optional identifier for the principal that triggered
          this run (e.g. a user ID for manual runs, a scheduled-task ID for
          scheduled runs). May be empty.
        type: string
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_domain_oppipeline.RunKind:
