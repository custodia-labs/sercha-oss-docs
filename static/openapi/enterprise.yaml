  /query:
    post:
      consumes:
      - application/json
      description: |-
        The single entry point for every SerchaQL statement kind — DDL, DCL, DML, SHOW, DESCRIBE, EXPLAIN and RUN BINDING.

        Send text as `{"serchaql": "..."}`, or a pre-compiled JSON IR tree as `{"ir": {...}}` (mutually exclusive).
        Multiple semicolon-separated statements execute in order and are **not** wrapped in a transaction.

        SELECT is available to any authenticated caller and is bounded by the three-layer permission model
        (corpus grant → corpus membership → per-document ACL), AND-composed and fail-closed.
        DDL, DCL, SHOW and RUN BINDING require an admin caller and return 403 otherwise.

        Set `explain=true` to compile and return the plan without executing it.
        A query joining an external plugin table may return 202 with a cost estimate; re-submit with `"confirm": true` to proceed.
      parameters:
      - description: Return the compiled plan instead of executing
        in: query
        name: explain
        type: boolean
      - description: SerchaQL text or JSON IR
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_driving_http.QueryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_adapters_driving_http.QueryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_adapters_driving_http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_adapters_driving_http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_adapters_driving_http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Execute a SerchaQL statement
      tags:
      - SerchaQL
  /query/json-ir:
    post:
      consumes:
      - application/json
      description: |-
        Executes a SerchaQL JSON IR operator tree on behalf of the authenticated caller.
        Pass ?explain=true to return the compiled plan without executing.
      parameters:
      - description: Return the compiled plan without executing
        in: query
        name: explain
        type: boolean
      - description: JSON IR operator tree
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_driving_http.jsonIRRequest'
      produces:
