        description: Name is the human-readable display name.
        type: string
      type:
        description: |-
          Type identifies the container type.
          Examples: "repository", "shared_drive", "space", "project", "channel"
        type: string
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driven.GroupedCount:
    properties:
      count:
        type: integer
      key:
        additionalProperties:
          type: string
        type: object
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.AIProvidersCapability:
    properties:
      embedding:
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.AIProvider'
        type: array
      llm:
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.AIProvider'
        type: array
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.AIProvidersResponse:
    properties:
      embedding:
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.AIProviderInfo'
        type: array
      llm:
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.AIProviderInfo'
        type: array
      reranker:
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.AIProviderInfo'
        type: array
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.AIServiceStatus:
    properties:
      available:
        type: boolean
      embedding_dim:
        description: Only for embedding service
        type: integer
      error:
        description: |-
          Error carries the reason a configured service is unavailable (factory
          construction or validation failure). Empty when Available or when the
          service is simply not configured. Distinguishes "configured but broken:
          <cause>" from "not configured" so misconfiguration is never silent.
        type: string
      model:
        type: string
      provider:
        $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.AIProvider'
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.AISettingsStatus:
    properties:
      effective_search_mode:
        $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.SearchMode'
      embedding:
        $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.AIServiceStatus'
      llm:
        $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.AIServiceStatus'
      reranker:
        $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.AIServiceStatus'
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.AuthorizeRequest:
    description: Request to start OAuth authorization flow
    properties:
      installation_name:
        description: |-
          InstallationName is an optional name for the installation.
          If not provided, defaults to "{Provider} ({AccountID})"
        example: My GitHub
        type: string
      provider_type:
        allOf:
        - $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.ProviderType'
        description: ProviderType is the OAuth provider (github, slack, notion, etc.)
        example: github
      return_context:
        description: |-
          ReturnContext indicates where to redirect after OAuth completes.
          Values: "setup" (FTUE), "admin-sources" (add source wizard), or empty for default.
        example: admin-sources
        type: string
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.AuthorizeResponse:
    description: Response containing the OAuth authorization URL
    properties:
      authorization_url:
        description: AuthorizationURL is the URL to redirect the user to for authorization.
        example: https://github.com/login/oauth/authorize?client_id=...
        type: string
      expires_at:
        description: ExpiresAt is when the authorization state expires (typically
          10 minutes).
        example: "2024-01-15T10:10:00Z"
        type: string
      state:
        description: |-
          State is the CSRF token that will be returned in the callback.
          This is provided for reference - the frontend should not need to track it.
        example: abc123xyz
        type: string
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.CapabilitiesResponse:
    properties:
      ai_providers:
        allOf:
        - $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.AIProvidersCapability'
        description: AIProviders lists AI providers available for embedding and LLM.
      descriptors:
        description: |-
          Descriptors lists every registered capability's metadata. Drives
          dynamic UI rendering — the admin panel iterates this list to know
          what toggles to show.
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.CapabilityDescriptor'
        type: array
      features:
        additionalProperties:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.CapabilityStatus'
        description: |-
          Features maps each registered capability's type to its resolved
          runtime status (available + enabled + active). Stable counterpart
          to Descriptors: callers cross-reference by Type.
        type: object
      limits:
        allOf:
        - $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.LimitsCapability'
        description: Limits defines operational boundaries from environment configuration.
      oauth_providers:
        description: OAuthProviders lists OAuth platforms configured via environment.
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.PlatformType'
        type: array
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.CapabilityStatus:
    properties:
      active:
        description: Active is Available AND Enabled.
        type: boolean
      available:
        description: |-
          Available reports whether the runtime can support this capability
          right now (backends configured, services healthy).
        type: boolean
      enabled:
        description: |-
          Enabled reports the operator's preference (or the descriptor default
          when no explicit preference is stored).
        type: boolean
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.ConnectionInfo:
    description: Connection metadata (no secrets) embedded in ProviderSummary.
    properties:
      auth_method:
        description: AuthMethod is the credential kind (api_key, app_only, oauth2,
          etc.).
        type: string
      id:
        description: ID is the stable connection identifier.
        type: string
      name:
        description: Name is the human-readable label chosen when the connection was
          created.
        type: string
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.CreateConnectionRequest:
    description: Request to create a connection for API key, path-based, or client-credentials
      connectors
    properties:
      api_key:
        description: |-
          APIKey is the authentication credential (or path for localfs).
          For auth_method "app_only" this field carries the client secret.
        example: /data/test-docs
        type: string
      app_credentials_ref:
        description: |-
          AppCredentialsRef is the client ID for OAuth 2.0 client_credentials auth.
          Only meaningful when AuthMethod is "app_only". The token endpoint and
          scopes are stored on the plugin provider row, not on the connection.
        example: my-client-id
        type: string
      auth_method:
        allOf:
        - $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.AuthMethod'
        description: |-
          AuthMethod is the credential kind. Defaults to "api_key" when omitted.
          Use "app_only" for OAuth 2.0 client_credentials (plugin_http providers).
        example: api_key
      name:
        description: Name is a human-readable name for the connection.
        example: Local Test Docs
        type: string
      provider_type:
        allOf:
        - $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.ProviderType'
        description: ProviderType is the data source provider.
        example: localfs
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.CreateSourceRequest:
    properties:
      config:
        $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.SourceConfig'
      connection_id:
        type: string
      containers:
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.Container'
        type: array
      name:
        type: string
      provider_type:
        $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.ProviderType'
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.Role'
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.EmbeddingSettingsInput:
    properties:
      model:
        type: string
      provider:
        $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.AIProvider'
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.FromManifestRequest:
    description: Request to register a plugin provider from a remote manifest URL.
    properties:
      connection_id:
        description: |-
          ConnectionID is the optional auth connection reference to attach to the
          newly registered provider. Pass empty for providers that require no auth.
        type: string
      kind:
        description: |-
          Kind selects the discovery path. Accepted values: "" (same as "http"),
          "http", "mcp". Any other value is rejected with ErrInvalidManifest.
        type: string
      url:
        description: |-
          URL is the absolute HTTP or HTTPS URL of the manifest or MCP server endpoint.
          For kind="" or "http": the service fetches GET {URL} to retrieve the plugin
          manifest JSON.
          For kind="mcp": URL is the MCP server base URL; the MCPDiscoverer connects
          and performs tools/list discovery.
        type: string
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.LLMSettingsInput:
    properties:
      model:
        type: string
      provider:
        $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.AIProvider'
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.LimitsCapability:
    properties:
      max_results_per_page:
        type: integer
      max_workers:
        type: integer
      sync_max_interval:
        type: integer
      sync_min_interval:
        type: integer
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.ListContainersResponse:
    description: Paginated list of containers available for indexing
    properties:
      containers:
        description: Containers is the list of available containers (repos, drives,
          spaces, etc.)
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_ports_driven.Container'
        type: array
      has_more:
        description: HasMore indicates if there are more containers to fetch.
        type: boolean
      next_cursor:
        description: NextCursor is the cursor for the next page, empty if no more
          pages.
        type: string
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.OperationSpec:
    description: Blueprint for one plugin operation attached to a provider.
    properties:
      batch_max:
        description: BatchMax is the maximum number of input rows per network call
          (>= 1).
        type: integer
      cache_ttl_seconds:
        description: |-
          CacheTTLSeconds is the cache freshness window in seconds; 0 caches
          indefinitely (until the provider's revision changes).
        type: integer
      name:
        description: Name is the operation identifier (lowercase snake, max 63 chars).
        type: string
      outputs:
        description: |-
          Outputs declares the columns returned per row by this operation.
          Must contain at least one entry.
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.ParamSpec'
        type: array
      params:
        description: |-
          Params declares the input columns the caller binds at join time.
          Each entry carries a name and a type (TEXT|FLOAT|INTEGER|BOOLEAN).
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.ParamSpec'
        type: array
      rate_limit_rpm:
        description: RateLimitRPM is the maximum requests per minute; 0 means no limit.
        type: integer
      soft_call_limit:
        description: SoftCallLimit is the operator warning threshold; 0 defaults to
          500.
        type: integer
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.OperationSummary:
    description: Plugin operation summary as returned in provider responses.
    properties:
      batch_max:
        description: BatchMax is the maximum input rows per network call.
        type: integer
      cache_ttl_seconds:
        description: CacheTTLSeconds is the cache freshness window in seconds.
        type: integer
      id:
        description: ID is the stable primary key.
        type: string
      name:
        description: Name is the operation identifier.
        type: string
      outputs:
        description: Outputs is the list of output columns.
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.ParamSpec'
        type: array
      params:
        description: Params is the list of input columns.
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.ParamSpec'
        type: array
      rate_limit_rpm:
        description: RateLimitRPM is the per-minute request cap; 0 means no limit.
        type: integer
      soft_call_limit:
        description: SoftCallLimit is the operator warning threshold.
        type: integer
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.ParamSpec:
    description: One named, typed parameter or output column in a plugin operation.
    properties:
      name:
        description: Name is the column name (lowercase snake, max 63 chars).
        type: string
      sample:
        description: |-
          Sample is an optional representative value for the param, used to build
          the sample invocation for provider tests. Must conform to Type when set.
      type:
        allOf:
        - $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain_plugin.ParamType'
        description: Type is the scalar type (TEXT|FLOAT|INTEGER|BOOLEAN).
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.ProviderListItem:
    properties:
      auth_methods:
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.AuthMethod'
        type: array
      configured:
        type: boolean
      description:
        type: string
      docs_url:
        type: string
      enabled:
        type: boolean
      name:
        type: string
      type:
        $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.ProviderType'
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.ProviderSummary:
    description: Registered plugin provider (no secret material).
    properties:
      base_endpoint:
        description: BaseEndpoint is the root URL; empty for builtin providers.
        type: string
      connection:
        allOf:
        - $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.ConnectionInfo'
        description: |-
          Connection is the metadata summary for the referenced connection.
          Nil when no connection is attached (builtin providers or http providers
          with no auth). Contains id, name, and auth_method only; no secrets.
      connection_id:
        description: ConnectionID is the connection reference for auth; empty when
          no auth.
        type: string
      created_at:
        description: CreatedAt is the RFC 3339 creation timestamp.
        type: string
      enabled:
        description: Enabled indicates whether this provider's operations are available.
        type: boolean
      id:
        description: ID is the stable primary key assigned by the repository.
        type: string
      kind:
        allOf:
        - $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain_plugin.Kind'
        description: Kind is the transport kind (http|mcp|builtin).
      last_test_at:
        description: |-
          LastTestAt is the RFC 3339 timestamp of the most recent /test call;
          omitted when no test has been run.
        type: string
      last_test_status:
        allOf:
        - $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain_plugin.TestStatus'
        description: LastTestStatus is the outcome of the most recent /test call.
      name:
        description: Name is the globally unique provider name.
        type: string
      operations:
        description: Operations is the list of operations this provider exposes.
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.OperationSummary'
        type: array
      revision:
        description: Revision is the monotonic config-change counter (part of cache
          key).
        type: integer
      scopes:
        description: |-
          Scopes is the OAuth 2.0 scope list for the client_credentials grant.
          Nil/empty when not configured.
        items:
          type: string
        type: array
      token_url:
        description: |-
          TokenURL is the OAuth 2.0 token endpoint for client_credentials auth.
          Empty when not configured.
        type: string
      updated_at:
        description: UpdatedAt is the RFC 3339 last-modified timestamp.
        type: string
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.PurgeResult:
    properties:
      branches_pruned:
        type: integer
      containers_deleted:
        type: integer
      documents_deleted:
        type: integer
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.QueryOpStat:
    properties:
      elapsed_ns:
        description: ElapsedNs is the wall-clock time spent in this operator in nanoseconds.
        type: integer
      operator_kind:
        description: OperatorKind is the operator type string, e.g. "CorpusScan",
          "EntityScan".
        type: string
      rows_in:
        description: RowsIn is the number of rows fed into this operator.
        type: integer
      rows_out:
        description: |-
          RowsOut is the number of rows emitted by this operator after filtering
          and projection.
        type: integer
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.QueryStats:
    properties:
      op_stats:
        description: |-
          OpStats holds per-operator timing and row-count data, in execution order.
          Each entry corresponds to one operator node in the plan tree.
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.QueryOpStat'
        type: array
      row_count:
        description: RowCount is the number of rows in the result set.
        type: integer
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.RegisterProviderRequest:
    description: Request to register a new plugin provider.
    properties:
      base_endpoint:
        description: BaseEndpoint is the root URL for http/mcp kinds; ignored for
          builtin.
        type: string
      connection_id:
        description: |-
          ConnectionID is the optional reference to an existing connection record
          that supplies auth credentials. Empty means no auth (public API or builtin).
          Must be empty for builtin providers.
        type: string
      kind:
        allOf:
        - $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain_plugin.Kind'
        description: 'Kind is the transport: "http", "mcp", or "builtin".'
      name:
        description: |-
          Name is the globally unique provider identifier (lowercase snake, max 63 chars).
          It becomes the virtual schema namespace key (plugins.<op>).
        type: string
      operations:
        description: |-
          Operations is the initial set of operations for this provider.
          Must contain at least one entry; each is validated by domain constructors.
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.OperationSpec'
        type: array
      scopes:
        description: |-
          Scopes is the OAuth 2.0 scope list forwarded to the token endpoint when
          using client_credentials. Only meaningful when TokenURL is set. Must be
          empty for builtin providers.
        items:
          type: string
        type: array
      token_url:
        description: |-
          TokenURL is the OAuth 2.0 token endpoint for client_credentials auth.
          Must be an absolute https URL when set. Only meaningful when ConnectionID
          is set and the referenced connection uses AuthMethodAppOnly. Must be
          empty for builtin providers.
        type: string
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.RerankerSettingsInput:
    properties:
      model:
        type: string
      provider:
        type: string
      timeout_ms:
        type: integer
      top_k:
        type: integer
      url:
        type: string
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.SetupRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.SetupResponse:
    properties:
      message:
        type: string
      user:
        $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.User'
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.SetupStatusResponse:
    properties:
      has_sources:
        type: boolean
      has_users:
        type: boolean
      setup_complete:
        type: boolean
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.TriggerReindexRequest:
    properties:
      priority:
        description: Priority sets the task priority (-100 to 100)
        type: integer
      source_ids:
        description: |-
          SourceIDs optionally specifies which sources to reindex
          If empty, all enabled sources are reindexed
        items:
          type: string
        type: array
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.UpdateAISettingsRequest:
    properties:
      embedding:
        $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.EmbeddingSettingsInput'
      llm:
        $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.LLMSettingsInput'
      reranker:
        $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.RerankerSettingsInput'
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.UpdateCapabilityPreferencesRequest:
    properties:
      toggles:
        additionalProperties:
          type: boolean
        type: object
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.UpdateProviderRequest:
    description: Request to update an existing plugin provider.
    properties:
      base_endpoint:
        description: BaseEndpoint, if non-empty, updates the root URL (http/mcp kinds
          only).
        type: string
      connection_id:
        description: |-
          ConnectionID, if non-empty, replaces the auth connection reference.
          Use the sentinel value "-" to clear the connection (no auth).
        type: string
      enabled:
        description: Enabled, if non-nil, toggles availability of this provider's
          operations.
        type: boolean
      operations:
        description: |-
          Operations, if non-nil, replaces the full set of operations for this
          provider. An empty slice is rejected; supply the complete desired list.
        items:
          $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.OperationSpec'
        type: array
      scopes:
        description: |-
          Scopes, if non-nil, replaces the OAuth 2.0 scope list.
          Use a non-nil empty slice to clear all scopes.
        items:
          type: string
        type: array
      token_url:
        description: |-
          TokenURL, if non-empty, updates the OAuth 2.0 token endpoint for
          client_credentials auth. Use the sentinel value "-" to clear.
          Must be an absolute https URL when not empty and not "-".
        type: string
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.UpdateSettingsRequest:
    properties:
      default_search_mode:
        $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.SearchMode'
      results_per_page:
        type: integer
      sync_enabled:
        type: boolean
      sync_exclusions:
        $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.SyncExclusionSettings'
      sync_interval_minutes:
        type: integer
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.UpdateSourceRequest:
    properties:
      config:
        $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.SourceConfig'
      enabled:
        type: boolean
      name:
        type: string
    type: object
  github_com_sercha-oss_sercha-enterprise_internal_core_ports_driving.UpdateUserRequest:
    properties:
      active:
        type: boolean
      name:
        type: string
      role:
        $ref: '#/definitions/github_com_sercha-oss_sercha-enterprise_internal_core_domain.Role'
    type: object
