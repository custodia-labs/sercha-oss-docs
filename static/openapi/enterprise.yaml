      links:
        description: |-
          Links is the ordered list of resolution strategies for an external-scope
          edge. Ignored for internal edges. For external edges, the runtime
          materialiser walks Links in ascending priority per candidate pair and
          stops at the first match. Required (non-empty) when Scope == "external".
        items:
          $ref: '#/definitions/internal_adapters_driving_http.edgeLinkRequest'
        type: array
